# Generated from deploy/redirects.json — keep in sync (npm run check:security enforces parity).
# Matches each path with or without its trailing slash and with an explicit index.html.
map $uri $kevinception_redirect {
  default "";
  "~^/experience/gen-x(/|/index\.html)?$" /experience/1990/;
  "~^/experience/xennial(/|/index\.html)?$" /experience/2000/;
  "~^/experience/millennial(/|/index\.html)?$" /experience/2010/;
  "~^/experience/gen-z(/|/index\.html)?$" /experience/2020/;
  "~^/experience/gen-alpha(/|/index\.html)?$" /experience/2030/;
  "~^/experience/gen-beta(/|/index\.html)?$" /experience/2040/;
  "~^/portfolio(/|/index\.html)?$" /about/;
  "~^/legacy(/|/index\.html)?$" /experience/;
  "~^/legacy/experience(/|/index\.html)?$" /experience/;
  "~^/legacy/experience/gen-x(/|/index\.html)?$" /experience/1990/;
  "~^/legacy/experience/xennial(/|/index\.html)?$" /experience/2000/;
  "~^/legacy/experience/millennial(/|/index\.html)?$" /experience/2010/;
  "~^/legacy/experience/gen-z(/|/index\.html)?$" /experience/2020/;
  "~^/legacy/experience/gen-alpha(/|/index\.html)?$" /experience/2030/;
  "~^/legacy/experience/gen-beta(/|/index\.html)?$" /experience/2040/;
  "~^/legacy/experience/2030(/|/index\.html)?$" /experience/2030/;
  "~^/legacy/experience/2040(/|/index\.html)?$" /experience/2040/;
  "~^/legacy/about(/|/index\.html)?$" /about/;
  "~^/legacy/portfolio(/|/index\.html)?$" /about/;
  "~^/legacy/resume(/|/index\.html)?$" /resume/;
  "~^/legacy/contact(/|/index\.html)?$" /contact/;
  "~^/legacy/work(/|/index\.html)?$" /work/;
  "~^/legacy/work/agentic-work-fleet(/|/index\.html)?$" /work/agentic-work-fleet/;
  "~^/legacy/work/kevin-online(/|/index\.html)?$" /work/kevin-online/;
  "~^/legacy/work/kevinception(/|/index\.html)?$" /work/kevinception/;
  "~^/legacy/work/mcp-knowledge-logistics(/|/index\.html)?$" /work/mcp-knowledge-logistics/;
  "~^/legacy/work/tokenpak(/|/index\.html)?$" /work/tokenpak/;
}

server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  # nginx only inherits add_header directives into a location that defines none
  # of its own, so every location that adds a header must include the shared
  # security headers again. The snippet is installed by the Dockerfile.
  include /etc/nginx/snippets/kevinception-security-headers.conf;

  # Static exports are served uncompressed by the stock image unless gzip is on.
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json application/xml image/svg+xml;

  # Permanent redirects for retired V6 URLs (see deploy/redirects.json).
  if ($kevinception_redirect) {
    return 301 $kevinception_redirect;
  }

  # Serve the experience shell directly when a client or framework omits the
  # trailing slash. This avoids an nginx directory redirect from container port
  # 80, which can otherwise drop an externally mapped port such as :8080.
  location = /experience {
    try_files /experience/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /_next/static/ {
    include /etc/nginx/snippets/kevinception-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /legacy/assets/ {
    include /etc/nginx/snippets/kevinception-security-headers.conf;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }
}
