server {
  listen 80;
  server_name _;
  absolute_redirect off;
  root /usr/share/nginx/html;
  index index.html;

  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
  add_header X-Frame-Options "SAMEORIGIN" always;
  add_header Cross-Origin-Opener-Policy "same-origin" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://plausible.io; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; media-src 'self' blob:; font-src 'self' data:; connect-src 'self' https://plausible.io; frame-src 'self'; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; frame-ancestors 'self'; form-action 'self'; upgrade-insecure-requests" always;

  # Serve the experience shell directly when a client or framework omits the
  # trailing slash. This avoids an nginx directory redirect from container port
  # 80, which can otherwise drop an externally mapped port such as :8080.
  location = /experience {
    try_files /experience/index.html =404;
  }

  location / {
    try_files $uri $uri/ $uri.html =404;
  }

  location /_next/static/ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  location /legacy/assets/ {
    expires -1;
    add_header Cache-Control "public, max-age=0, must-revalidate";
  }

  error_page 404 /404.html;

  location = /404.html {
    internal;
  }
}
