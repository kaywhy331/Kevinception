[build]
command = "npm run build"
publish = "out"

# Permanent redirects for retired V6 URLs. Source of truth: deploy/redirects.json
# (npm run check:security enforces parity across every deploy target).
# force = true so a rule still applies while a file exists at the old path.

[[redirects]]
from = "/experience/gen-x/"
to = "/experience/1990/"
status = 301
force = true

