<script>
(function(){
  document.documentElement.dataset.embedded='true';
  document.addEventListener('click',function(event){
    var anchor=event.target && event.target.closest ? event.target.closest('a[href^="/"]') : null;
    if(!anchor) return;
    var href=anchor.getAttribute('href');
    if(!href || href.indexOf('/legacy/')===0 || href.indexOf('/assets/')===0) return;
    event.preventDefault();
    window.parent.postMessage({type:'kevinception:navigate',href:href},window.location.origin);
  },true);
  window.parent.postMessage({type:'kevinception:legacy-ready',path:window.location.pathname},window.location.origin);
})();
</script>
</body>
