    <text x="88" y="310" font-size="102" font-weight="700" letter-spacing="-7">Kevinception</text>
    <text x="94" y="380" font-family="Georgia, serif" font-size="45" font-style="italic" fill="#d8d4c9">Layers within layers.</text>
    <text x="94" y="492" font-family="monospace" font-size="23" fill="#a7a4a0">ONE IDENTITY / MULTIPLE TIMELINES</text>
