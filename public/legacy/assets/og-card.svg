    <filter id="glow"><feGaussianBlur stdDeviation="12" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="64" height="64" patternUnits="userSpaceOnUse"><path d="M64 0H0V64" fill="none" stroke="#fff" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <g transform="translate(870 315)" fill="none">
    <circle r="222" stroke="#7dffb2" stroke-opacity=".18"/>
    <circle r="155" stroke="#8c7cff" stroke-opacity=".28"/>
    <rect x="-88" y="-88" width="176" height="176" transform="rotate(45)" stroke="#7dffb2" stroke-width="2" filter="url(#glow)"/>
    <rect x="-48" y="-48" width="96" height="96" transform="rotate(45)" stroke="#50d9ff" stroke-opacity=".6"/>
    <path d="M-22-55v110M-20 0L46-56M-20 0l70 58" stroke="#f7f3e8" stroke-width="11"/>
  </g>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f7f3e8">
