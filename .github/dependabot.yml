version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      react-three:
        patterns: ['three', '@types/three', '@react-three/*', 'postprocessing']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-plugin-*', 'typescript-eslint', 'prettier', 'stylelint', 'globals']
      test:
        patterns: ['vitest', '@testing-library/*', 'jsdom', 'puppeteer-core']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
