name: Debug test output
on:
  pull_request:

jobs:
  test-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Capture JavaScript syntax output
        shell: bash
        run: |
          set +e
          node --check public/legacy/assets/client/kevtok-native.js > syntax-output.txt 2>&1
          exit 0
      - name: Capture Vitest output
        id: tests
        shell: bash
        run: |
          set +e
          npm run test -- --reporter=verbose > test-output.txt 2>&1
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: test-diagnostics
          path: |
            syntax-output.txt
            test-output.txt
      - name: Preserve failure status
        shell: bash
        run: exit "${{ steps.tests.outputs.status }}"
