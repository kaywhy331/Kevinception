name: V8 branch metadata
on:
  pull_request:
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - name: Print Git object metadata
        shell: bash
        run: |
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "TREE_SHA=$(git rev-parse HEAD^{tree})"
