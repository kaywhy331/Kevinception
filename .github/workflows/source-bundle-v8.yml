name: Source bundle V8
on:
  pull_request:
    branches: [main]

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Package repository source and dependencies
        shell: bash
        run: |
          tar \
            --exclude=.git \
            --exclude=.next \
            --exclude=out \
            --exclude=coverage \
            -czf "$RUNNER_TEMP/kevinception-workspace.tgz" .
      - name: Upload source workspace
        uses: actions/upload-artifact@v4
        with:
          name: source-workspace-v8
          path: ${{ runner.temp }}/kevinception-workspace.tgz
          compression-level: 0
          if-no-files-found: error
