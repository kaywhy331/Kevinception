name: V8 branch metadata
on:
  pull_request:
    branches: [main]

jobs:
  metadata:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/award-ready-v8
      - name: Record Git object metadata
        shell: bash
        run: |
          git rev-parse HEAD > commit-sha.txt
          git rev-parse HEAD^{tree} > tree-sha.txt
      - name: Upload Git object metadata
        uses: actions/upload-artifact@v4
        with:
          name: v8-tree-metadata
          path: |
            commit-sha.txt
            tree-sha.txt
          if-no-files-found: error
