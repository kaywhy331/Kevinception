name: Browser smoke
# Called by ci.yml after `verify` so the probes reuse the same static export.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: static-export
          path: out
      - name: Run every browser runtime probe
        shell: bash
        run: |
          npm run preview > preview-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          ready=0
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://127.0.0.1:4321/ > /dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            cat preview-server.log
            exit 1
          fi

          chrome_path="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$chrome_path" ]; then
            echo 'No supported Chromium browser is installed on the runner.'
            exit 1
          fi

          CHROME_PATH="$chrome_path" BASE_URL=http://127.0.0.1:4321 npm run test:runtime:all
      - name: Upload runtime reports and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: runtime-artifacts
          if-no-files-found: warn
          path: |
            artifacts
            preview-server.log
